name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a pull request cancels its older run, but every master commit gets its own run:
# sharing a group, the next merge cancelled the one before, which then never had a result. The
# metrics job retries its push, so master runs can overlap.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Read-only by default: pull requests, including ones from forks, run untrusted code. Only the
# metrics job, which exists only for pushes to master, can write.
permissions:
  contents: read

jobs:
  whitespace:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A pull request is checked out as its merge into the base branch, so HEAD^1 is the base.
      - name: No trailing whitespace or blank lines at end of file
        run: git diff --check HEAD^1 HEAD

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install QEMU and OVMF
        timeout-minutes: 15
        run: |
          # The runners' apt mirror has stopped resolving for half an hour at a time, and one
          # attempt can sit on DNS timeouts for 20 minutes. So the network steps get two minutes
          # each, and the install, which needs no network, has no limit of its own: killing dpkg
          # partway would leave packages half configured.
          packages="qemu-system-x86 ovmf"
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update \
                && timeout 120 sudo apt-get install -y --no-install-recommends --download-only $packages; then
              sudo apt-get install -y --no-install-recommends $packages
              exit 0
            fi
            getent hosts azure.archive.ubuntu.com archive.ubuntu.com github.com || true
            # Every pocket goes through this list. kernel.org's copy is off Canonical's DNS,
            # which is what has failed so far.
            echo http://mirrors.edge.kernel.org/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt
            [ "$attempt" = 3 ] || sleep 60
          done
          exit 1

      - name: Compiler unit tests
        run: make unit-test

      - name: JavaScript compiler (jsc vs node, on Linux, the JVM and Duke)
        run: make js-test

      - name: Boot test
        run: make boot-test

      - name: Record the boot environment
        run: tools/boot-env.sh | tee build-env.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Conformance (HotSpot vs Duke)
        run: make conformance

      - name: Conformance with a GC at every allocation
        run: make conformance-gc

      - name: Panic tests (runtime checks fail loudly)
        run: make panic-tests

      - name: Kernel tests (inside the booted kernel)
        run: make ktest

      - name: Shell over serial and PS/2
        run: make shell-test

      - name: Java programs in ring 3 (HotSpot vs Linux and Duke)
        run: make user-test

      - name: C programs in ring 3 (musl, Linux vs Duke)
        run: make c-test

      - name: Upload kernel and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.sha }}
          path: |
            build/kernel.elf
            build/kernel.map
            build/serial.log
            build/serial.qemu.log
            build/shell-test/
            build-env.txt
            build/conformance/serial.log
            build/conformance/serial.qemu.log
            build/conformance/boot.txt
            build/panics/*/serial.log
            build/panics/*/qemu.log
            build/ktest/serial.log
            build/ktest/qemu.log
            build/user-tests/duke/serial.log
            build/user-tests/duke/qemu.log
            build/c-tests/duke/serial.log
            build/c-tests/duke/qemu.log
            build/js-tests/duke/serial.log
            build/js-tests/duke/qemu.log
            compiler/build/reports/tests/
            compiler/build/test-results/test/*.xml
          if-no-files-found: ignore

  metrics:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Pushes the new row and chart to the metrics branch.
      contents: write
      # The calibration counts open PRs as in review.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The tier list reads the whole history.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Fetch the build's kernel and test results
        uses: actions/download-artifact@v8
        with:
          name: kernel-${{ github.sha }}

      - name: Record metrics
        run: tools/record-metrics.sh
        env:
          GH_TOKEN: ${{ github.token }}
