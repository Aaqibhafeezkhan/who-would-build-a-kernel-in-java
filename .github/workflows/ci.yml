name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default: pull requests, including ones from forks, run untrusted code. Only the
# metrics job, which exists only for pushes to master, can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: Compiler unit tests
        run: make unit-test

      - name: JavaScript compiler (jsc vs node, on Linux, the JVM and Duke)
        run: make js-test

      - name: Boot test
        run: make boot-test

      - name: Record the boot environment
        run: tools/boot-env.sh | tee build-env.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Conformance (HotSpot vs Duke)
        run: make conformance

      - name: Conformance with a GC at every allocation
        run: make conformance-gc

      - name: Panic tests (runtime checks fail loudly)
        run: make panic-tests

      - name: Kernel tests (inside the booted kernel)
        run: make ktest

      - name: Shell over serial and PS/2
        run: make shell-test

      - name: Upload kernel and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.sha }}
          path: |
            build/kernel.elf
            build/kernel.map
            build/serial.log
            build/shell-test/
            build-env.txt
            build/conformance/serial.log
            build/conformance/boot.txt
            build/panics/*/serial.log
            build/ktest/serial.log
            build/js-tests/duke/serial.log
            compiler/build/reports/tests/
            compiler/build/test-results/test/*.xml
          if-no-files-found: ignore

  metrics:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Pushes the new row and chart to the metrics branch.
      contents: write
      # The calibration counts open PRs as in review.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The tier list reads the whole history.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Fetch the build's kernel and test results
        uses: actions/download-artifact@v8
        with:
          name: kernel-${{ github.sha }}

      - name: Record metrics
        run: tools/record-metrics.sh
        env:
          GH_TOKEN: ${{ github.token }}
